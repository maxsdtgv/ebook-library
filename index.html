<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Library</title>
    <link rel="stylesheet" href="ebook_app/styles.css">
</head>
<body>
    <header>
        <nav>
            <button onclick="showUserView()" data-i18n="nav.library">Library</button>
            <button onclick="showAdminView()" data-i18n="nav.manage">Manage</button>
            <button id="themeToggle" onclick="toggleTheme()" data-i18n-title="nav.theme.title">🌙</button>
            <button id="langToggle" onclick="toggleLang()" data-i18n-title="nav.lang.title">RU</button>
        </nav>

        <!-- Hidden while everything is normal. Appears only when the user must
             act: no catalogue file was found (offers a manual load), or unsaved
             changes from a previous session are waiting (offers restore/discard). -->
        <div id="loadBar" class="load-bar" style="display: none;">
            <span id="loadBarText"></span>
            <span id="loadBarPick">
                <input type="file" id="libraryFileInput" accept=".json,application/json">
                <button type="button" onclick="loadLibraryFile()" data-i18n="bar.load">Load library</button>
            </span>
            <span id="loadBarDraft" style="display: none;">
                <button type="button" onclick="restoreDraft()" data-i18n="bar.restore">Restore changes</button>
                <button type="button" onclick="discardDraft()" data-i18n="bar.keepSaved">Keep saved version</button>
            </span>
        </div>

        <!-- Shown after any change, until the user saves the library back to a file. -->
        <div id="saveWarning" class="save-warning" style="display: none;">
            <span data-i18n="warn.unsaved">Library changed — save it before closing the browser!</span>
            <button onclick="window.library.saveToFile()" data-i18n="warn.saveNow">Save now</button>
            <button onclick="window.library.dismissWarning()" data-i18n="warn.dismiss">Dismiss</button>
        </div>

        <h1 data-i18n="app.title">Electronic Library</h1>
    </header>

    <!-- Library (user) view -->
    <div id="userView" class="view active">
        <div class="controls">
            <input type="text" id="searchInput" data-i18n-placeholder="filter.search" placeholder="Search books..." oninput="filterBooks()">
            <select id="categoryFilter" onchange="filterBooks()">
                <option value="" data-i18n="filter.allCategories">All Categories</option>
            </select>
            <select id="authorFilter" onchange="filterBooks()">
                <option value="" data-i18n="filter.allAuthors">All Authors</option>
            </select>
            <select id="yearFilter" onchange="filterBooks()">
                <option value="" data-i18n="filter.allYears">All Years</option>
            </select>
            <select id="fileTypeFilter" onchange="filterBooks()">
                <option value="" data-i18n="filter.allTypes">All Types</option>
            </select>
            <select id="classificationFilter" onchange="filterBooks()">
                <option value="" data-i18n="filter.allBooks">All Books</option>
                <option value="favorites" data-i18n="filter.favorites">⭐ Favorites</option>
                <option value="readLater" data-i18n="filter.readLater">📚 Read Later</option>
                <option value="workBooks" data-i18n="filter.workBooks">💼 Work Books</option>
                <option value="hobbyBooks" data-i18n="filter.hobbyBooks">🎯 Hobby Books</option>
            </select>
            <div class="view-toggle">
                <button id="gridBtn" onclick="setViewMode('grid')" class="active" data-i18n="view.grid">Grid</button>
                <button id="listBtn" onclick="setViewMode('list')" data-i18n="view.list">List</button>
            </div>
        </div>
        <div id="booksContainer" class="books-grid"></div>
    </div>

    <!-- Manage (admin) view -->
    <div id="adminView" class="view">
        <div class="admin-section">
            <h2 data-i18n="manage.addBook">Add Book</h2>
            <p class="hint" data-i18n="manage.addHint"></p>
            <p class="hint editing-hint" id="editingHint" style="display: none;"></p>
            <form id="addBookForm">
                <input type="text" id="bookTitle" data-i18n-placeholder="form.title" placeholder="Title" required>
                <input type="text" id="bookAuthor" data-i18n-placeholder="form.author" placeholder="Author" required>
                <input type="number" id="bookYear" data-i18n-placeholder="form.year" placeholder="Year" min="1000" max="2100">
                <textarea id="bookDescription" data-i18n-placeholder="form.description" placeholder="Short description" rows="3"></textarea>
                <label class="field-label" for="bookFile" data-i18n="form.bookFile">Ebook file (in books/)</label>
                <input type="file" id="bookFile" accept=".epub,.pdf,.txt,.doc,.docx,.djvu,.pub" required>
                <label class="field-label" for="thumbnailFile" data-i18n="form.coverFile">Cover image (in thumbnails/, optional)</label>
                <input type="file" id="thumbnailFile" accept="image/*">
                <select id="bookCategory" required>
                    <option value="" data-i18n="form.selectCategory">Select Category</option>
                </select>
                <button type="submit" id="bookSubmitBtn" data-i18n="form.submit">Add Book</button>
                <button type="button" id="cancelEditBtn" style="display: none;"
                        onclick="window.library.cancelEdit()" data-i18n="form.cancelEdit">Cancel editing</button>
            </form>
        </div>

        <div class="admin-section">
            <h2 data-i18n="manage.categories">Manage Categories</h2>
            <input type="text" id="newCategory" data-i18n-placeholder="manage.categoryName" placeholder="Category name">
            <button onclick="addCategory()" data-i18n="manage.addCategory">Add Category</button>
            <div style="margin-top: 20px;"></div>
            <div id="categoriesList"></div>
        </div>

        <div class="admin-section">
            <h2 data-i18n="manage.save">Save Library</h2>
            <button onclick="window.library.saveToFile()" data-i18n="manage.saveCatalogue">Save library</button>
            <p><small data-i18n="manage.saveHint"></small></p>
        </div>

        <div class="admin-section">
            <h2 data-i18n="manage.books">Manage Books</h2>
            <div id="adminBooksList"></div>
        </div>
    </div>

    <!-- In-app reader: an overlay with the file in an iframe. Closes on the ✕,
         on a click outside the window, or on Escape. -->
    <div id="readerOverlay" class="reader-overlay" style="display: none;"
         onclick="if (event.target === this) window.library.closeReader()">
        <div class="reader-window">
            <div class="reader-header">
                <span id="readerTitle"></span>
                <button class="reader-close" onclick="window.library.closeReader()"
                        data-i18n-title="viewer.close">✕</button>
            </div>
            <div id="readerBody" class="reader-body"></div>
        </div>
    </div>

    <!-- The catalogue is loaded as a script, not fetched: a file:// page is not
         allowed to fetch() local files, but it may load a <script>. This is what
         makes the library appear automatically, with no clicks. Missing file is
         harmless — the app then offers the manual "Load library" button. -->
    <script src="ebook_app/i18n.js"></script>
    <script src="data.js"></script>
    <script src="ebook_app/script.js"></script>
</body>
</html>
